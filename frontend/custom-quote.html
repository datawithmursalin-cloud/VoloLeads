<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Custom Meeting | VoloLeads</title>
    <meta name="description" content="Request a custom VoloLeads strategy meeting for a tailored lead generation and cold calling setup.">
    <link rel="icon" type="image/webp" href="./png/logo.webp" sizes="any">
    <link rel="apple-touch-icon" href="./png/logo.webp">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="tailwind.css?v=20260610-02">
    <link rel="stylesheet" href="styles.css?v=20261003-02">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-light dark:bg-slate-950 text-brand-navy dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">
    <!-- site:header -->

    <main class="utility-page-main relative flex-grow pt-36 pb-24 px-4 overflow-hidden">
        <section class="utility-shell max-w-5xl mx-auto px-6 md:px-10 py-10 md:py-12">
            <div class="text-center max-w-3xl mx-auto mb-8">
                <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center ring-8 ring-orange-50 dark:ring-orange-950/40">
                    <i class="fa-solid fa-calendar-check text-brand-orange text-3xl" aria-hidden="true"></i>
                </div>
                <p class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-[0.24em] bg-orange-50 dark:bg-orange-950/40 text-brand-orange mb-5">Custom Quote</p>
                <h1 class="text-4xl md:text-5xl font-extrabold text-brand-navy dark:text-white mb-4">Request a Custom Meeting</h1>
                <p class="text-base md:text-lg text-slate-600 dark:text-slate-300 leading-relaxed">
                    For investors, wholesalers and agents: tell us what you need, and we will plan a strategy call around your market, team size, systems and goals.
                </p>
            </div>

            <div class="utility-form-card max-w-3xl mx-auto">
                <div class="px-6 md:px-9 pt-8 md:pt-9 pb-10 md:pb-11">
                    <form id="contact-form" class="custom-quote-form space-y-6">
                        <div class="honey-trap">
                            <label for="website_honeypot">Website</label>
                            <input type="text" id="website_honeypot" name="website_honeypot" tabindex="-1" autocomplete="off">
                        </div>

                        <div class="custom-quote-field-grid grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-1">
                                <label for="contact-name" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Full Name <span class="text-red-500">*</span></label>
                                <input id="contact-name" type="text" name="name" autocomplete="name" required minlength="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400" placeholder="Jane Smith">
                            </div>

                            <div class="space-y-1">
                                <label for="contact-company" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Company Name</label>
                                <input id="contact-company" type="text" name="company" autocomplete="organization" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400" placeholder="XYZ Home Buyers LLC">
                            </div>
                        </div>

                        <div class="custom-quote-field-grid grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-1">
                                <label for="contact-email" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Work Email <span class="text-red-500">*</span></label>
                                <input id="contact-email" type="email" name="email" autocomplete="email" spellcheck="false" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400" placeholder="jane@company.com">
                            </div>

                            <div class="space-y-1">
                                <label for="contact-phone" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Phone Number <span class="text-red-500">*</span></label>
                                <input id="contact-phone" type="tel" name="phone" autocomplete="tel" inputmode="tel" required minlength="10" pattern="[0-9+\-\.() ]{10,}" title="Please enter a valid phone number (at least 10 digits)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>

                        <div class="custom-quote-field-grid grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-1">
                                <label for="service-select" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Type of Service <span class="text-red-500">*</span></label>
                                <select id="service-select" name="service" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:bg-white appearance-none cursor-pointer font-medium">
                                    <option value="Custom Quote" selected>Custom Quote</option>
                                    <option value="Essential">Essential</option>
                                    <option value="Growth">Growth</option>
                                    <option value="Scale">Scale</option>
                                </select>
                            </div>

                            <div class="space-y-1">
                                <label for="preferred-date" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Preferred Meeting Date</label>
                                <input type="date" id="preferred-date" name="preferred_date" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400 text-sm">
                            </div>
                        </div>

                        <div id="quantity-row" class="hidden space-y-1 animate-fade-in-down">
                            <label for="quantity-select" class="text-xs font-bold text-brand-orange uppercase tracking-wide ml-1">Number of Cold Callers <span class="text-red-500">*</span></label>
                            <select id="quantity-select" name="quantity" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-brand-navy dark:text-white dark:bg-slate-700 dark:border-slate-600 outline-none focus:border-brand-orange focus:bg-white dark:focus:bg-slate-700 appearance-none cursor-pointer font-bold">
                                <option value="" disabled selected>Select Quantity...</option>
                                <option value="1 Seat">Just One</option>
                                <option value="2-3 Seats">Two - Three</option>
                                <option value="4-9 Seats">Four - Nine</option>
                                <option value="10+ Seats">Ten+ (Enterprise)</option>
                            </select>
                        </div>

                        <div id="time-row" class="hidden space-y-1">
                            <label for="preferred-time" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">Preferred Time (EST)</label>
                            <select id="preferred-time" name="preferred_time" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all text-sm appearance-none cursor-pointer">
                                <option value="" disabled selected>Select a time...</option>
                            </select>
                            <input type="hidden" id="preferred-timezone" name="preferred_timezone" value="EST">
                        </div>

                        <div class="space-y-1">
                            <label for="contact-message" class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide ml-1">What should we build?</label>
                            <textarea id="contact-message" name="message" rows="5" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 rounded-lg text-slate-800 outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange focus:bg-white transition-all placeholder-slate-400 resize-none" placeholder="Tell us about your markets, caller volume, CRM, reporting needs, or anything custom you want included."></textarea>
                        </div>

                        <input type="hidden" id="referral-source" name="referral_source" value="Custom Quote Page">
                        <input type="hidden" id="referral-source-other" name="referral_source_other" value="">

                        <div class="flex justify-center">
                            <div class="cf-turnstile" data-sitekey="0x4AAAAAADKTLan8Zgz02zqw" data-theme="auto"></div>
                        </div>

                        <button type="submit" id="submit-btn" class="w-full py-4 mt-4 bg-brand-orange hover:bg-orange-600 text-white font-bold text-lg rounded-xl shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                            <span id="btn-text">Request Meeting</span>
                            <span id="btn-loader" class="hidden"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Sending...</span>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- site:footer -->

    <script src="icons.js?v=20260610-02"></script>
    <script src="app.js?v=20261028-01"></script>
</body>
</html>
