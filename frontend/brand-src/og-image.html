<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoloLeads Open Graph Image</title>
<!-- Source for png/logo/og-image.png (1200x630). Re-render: see brand-src/README.md -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0F172A; --orange:#F97316; --tint:#FB923C; --muted:#94A3B8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; font-family:Inter, sans-serif; color:#fff; background:var(--navy); }
  .card { width:1200px; height:630px; padding:72px 80px 60px; display:flex; flex-direction:column; overflow:hidden;
          background:radial-gradient(900px 520px at 108% -12%, rgba(249,115,22,.26), transparent 60%), var(--navy); }
  .brand { display:flex; align-items:center; gap:4px; font-weight:800; font-size:40px; letter-spacing:-.01em; }
  .brand img { width:84px; height:84px; object-fit:contain; margin-left:-7px; }
  .brand .leads { color:var(--orange); }
  .eyebrow { margin-top:64px; font-size:20px; font-weight:700; letter-spacing:.14em; color:var(--tint); text-transform:uppercase; }
  h1 { margin-top:18px; font-size:76px; line-height:1.02; font-weight:800; letter-spacing:-.025em; max-width:980px; }
  .sub { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; font-size:26px; font-weight:600; color:#CBD5E1; }
  .url { font-size:22px; color:var(--muted); font-weight:500; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="logo-bolt.png" alt=""><span>Volo<span class="leads">Leads</span></span></div>
    <div class="eyebrow">Seller acquisitions for real estate</div>
    <h1>Fully Managed Seller Acquisition Teams.</h1>
    <div class="sub"><span>For investors, wholesalers and agents</span><span class="url">vololeads.com</span></div>
  </div>
</body>
</html>
