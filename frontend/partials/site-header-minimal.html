<!-- Minimal shared header for focused flows (onboarding): logo and theme toggle only. Included with the site:header:minimal placeholder. -->
<div class="site-header-shell site-header-shell--minimal" data-site-header>
    <header class="site-header">
        <div class="site-header-bar">
            <a href="/" class="site-brand-lockup site-header-brand" aria-label="VoloLeads home">
                <img src="./png/logo.webp" alt="" aria-hidden="true" class="site-nav-logo">
                <span class="site-wordmark"><span class="site-wordmark-volo">Volo</span><span class="site-wordmark-leads">Leads</span></span>
            </a>
            <div class="site-header-actions">
                <button id="dark-mode-toggle" class="site-icon-btn theme-switch" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode" title="Switch to dark mode">
                    <i class="fa-solid fa-moon" id="dark-mode-icon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>
</div>
