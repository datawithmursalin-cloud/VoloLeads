<!-- Minimal shared header for focused flows (onboarding): logo and theme picker only. Included with the site:header:minimal placeholder. -->
<div class="site-header-shell site-header-shell--minimal" data-site-header>
    <header class="site-header">
        <div class="site-header-bar">
            <a href="/" class="site-brand-lockup site-header-brand" aria-label="VoloLeads home">
                <img src="./png/logo.webp" alt="" aria-hidden="true" class="site-nav-logo">
                <span class="site-wordmark"><span class="site-wordmark-volo">Volo</span><span class="site-wordmark-leads">Leads</span></span>
            </a>
            <div class="site-header-actions">
                <div class="theme-picker">
                    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
                    <select data-theme-picker aria-label="Color theme">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
            </div>
        </div>
    </header>
</div>
